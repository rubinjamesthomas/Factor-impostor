name: Build Factor Impostor Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets typescript

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp factor-impostor-banner.png www/
          cp impostor-caught.png www/
          cp impostor-escaped.png www/
          cp innocent-accused.png www/
          cp innocent-unharmed.png www/
          cp mission-accomplished.png www/
          cp mission-failed.png www/

      - name: Prepare app icon
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Factor-Impostor-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
